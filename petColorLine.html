<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物彩线计算</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#E67E22',
                        secondary: '#3498DB',
                        neutral: '#2C3E50',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .input-focus {
                @apply focus:ring-2 focus:ring-secondary/50 focus:border-secondary outline-none;
            }
            .card-shadow {
                @apply shadow-md hover:shadow-lg transition-shadow;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-8 px-4">
    <div class="max-w-md mx-auto bg-white rounded-xl p-6 card-shadow relative">
        <!-- 标题栏（含返回按钮，水平对齐布局） -->
        <div class="flex items-center justify-center mb-8 relative">
            <a href="index.html" class="absolute left-0 text-gray-600 hover:text-neutral transition-colors">
                <i class="fa fa-arrow-left mr-1"></i> 返回
            </a>
            <h1 class="text-2xl font-bold text-neutral">
                <i class="fa fa-paw text-secondary text-2xl mr-2"></i>宠物彩线计算
            </h1>
        </div>

        <div class="space-y-6">
            <div>
                <label for="growthInput" class="block text-sm font-medium text-gray-700 mb-1">
                    三级天赋技能成长值
                </label>
                <input type="number" id="growthInput" placeholder="例如：7.0123" step="0.0001" min="0"
                       class="w-full border border-gray-300 rounded-md px-3 py-2 input-focus">
                <p class="text-xs text-gray-500 mt-1">请输入宠物彩三级天赋技能的成长值</p>
            </div>

            <div class="p-4 bg-gray-50 rounded-lg border border-gray-200">
                <h3 class="text-sm font-medium text-gray-500 mb-2">彩线：</h3>
                <p id="result" class="text-3xl font-bold text-secondary text-center">0.0000</p>
                <p class="text-xs text-gray-500 text-center mt-1">计算公式：三级天赋成长值 ÷ 1.4</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const growthInput = document.getElementById('growthInput');
            const resultElement = document.getElementById('result');

            // 计算彩线成长率
            function calculateGrowthRate() {
                const inputValue = parseFloat(growthInput.value);
                if (isNaN(inputValue) || inputValue < 0) {
                    resultElement.textContent = '0.0000';
                    return;
                }
                
                const growthRate = inputValue / 1.4;
                resultElement.textContent = growthRate.toFixed(4);
            }

            // 输入变化时实时计算
            growthInput.addEventListener('input', calculateGrowthRate);
        });
    </script>
</body>
</html>
