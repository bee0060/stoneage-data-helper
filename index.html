<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>词条管理工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3B82F6',
            secondary: '#10B981',
            danger: '#EF4444',
            qualityBlue: '#3B82F6',
            qualityPurple: '#9B59B6',
            qualityOrange: '#F59E0B',
            qualityRed: '#EF4444',
            qualityPerfect: '#99F10C',
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
            .tab-active { @apply border-b-2 border-primary text-primary font-medium; }
            .tab-content { @apply hidden; }
            .tab-content-active { @apply block; }
            .input { @apply w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary; }
            .btn { @apply px-4 py-2 rounded-md transition-all active:scale-95; }
            .btn-primary { @apply bg-primary text-white hover:bg-primary/90; }
            .btn-secondary { @apply bg-secondary text-white hover:bg-secondary/90; }
            .btn-danger { @apply bg-danger text-white hover:bg-danger/90; }
            .toast { @apply fixed bottom-4 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-md text-white z-50 transition-all duration-300 opacity-0; }
            .toast-show { @apply opacity-100; }
            .scrollbar-thin { scrollbar-width: thin; }
            .scrollbar-thin::-webkit-scrollbar { width: 4px; }
            .scrollbar-thin::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.5); border-radius: 2px; }
            .result-block { @apply bg-gray-50 rounded-lg p-4 mb-4 border border-gray-200; }
            .result-indent { @apply pl-4 mt-2 border-l-2 border-gray-200; }
            .quality-checkbox { @apply flex items-center gap-2 cursor-pointer; }
            .quality-checkbox input:checked + span { @apply ring-2 ring-primary; }
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen p-4 pb-20">
  <!-- 标签切换区 -->
  <div class="bg-white rounded-t-lg shadow-sm border-b">
    <div class="flex">
      <button id="queryTab" class="tab-active px-6 py-3 focus:outline-none">
        <i class="fa fa-search mr-2"></i>查询
      </button>
      <button id="entryTab" class="px-6 py-3 focus:outline-none text-gray-500">
        <i class="fa fa-pencil mr-2"></i>录入
      </button>
    </div>
  </div>

  <!-- 查询标签内容 -->
  <div id="queryContent" class="tab-content tab-content-active bg-white rounded-b-lg shadow-sm p-4 min-h-[400px]">
    <h2 class="text-xl font-semibold mb-4">词条查询</h2>

    <!-- 查询筛选区（级联+品质多选） -->
    <div class="space-y-4 mb-6">
      <div>
        <label class="block text-sm text-gray-600 mb-1">大品类</label>
        <select id="searchCategory" class="input" required>
          <option value="all">全部</option>
        </select>
      </div>

      <div>
        <label class="block text-sm text-gray-600 mb-1">小品类</label>
        <select id="searchSubCategory" class="input" required>
          <option value="all">全部</option>
        </select>
      </div>

      <div>
        <label class="block text-sm text-gray-600 mb-1">词条名称</label>
        <div class="relative">
          <select id="searchAttribute" class="input mb-1">
            <option value="">先选品类</option>
          </select>
          <input type="text" id="searchItemName" class="input pr-8" placeholder="输入或选择词条">
          <div id="itemSuggestions"
            class="absolute top-full left-0 right-0 mt-1 bg-white border rounded-md shadow-lg max-h-40 overflow-y-auto scrollbar-thin z-10 hidden">
            <!-- 词条建议将动态生成 -->
          </div>
        </div>
      </div>

      <!-- 品质多选区 -->
      <div>
        <label class="block text-sm text-gray-600 mb-2">品质（可多选）</label>
        <div class="flex flex-wrap gap-4">
          <label class="quality-checkbox">
            <input type="checkbox" name="searchQuality" value="blue" class="sr-only">
            <span
              class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-qualityBlue/10 text-qualityBlue border border-qualityBlue">
              <span class="w-2 h-2 rounded-full bg-qualityBlue"></span>
              蓝色
            </span>
          </label>
          <label class="quality-checkbox">
            <input type="checkbox" name="searchQuality" value="purple" class="sr-only">
            <span
              class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-qualityPurple/10 text-qualityPurple border border-qualityPurple">
              <span class="w-2 h-2 rounded-full bg-qualityPurple"></span>
              紫色
            </span>
          </label>
          <label class="quality-checkbox">
            <input type="checkbox" name="searchQuality" value="orange" class="sr-only">
            <span
              class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-qualityOrange/10 text-qualityOrange border border-qualityOrange">
              <span class="w-2 h-2 rounded-full bg-qualityOrange"></span>
              橙色
            </span>
          </label>
          <label class="quality-checkbox">
            <input type="checkbox" name="searchQuality" value="red" class="sr-only">
            <span
              class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-qualityRed/10 text-qualityRed border border-qualityRed">
              <span class="w-2 h-2 rounded-full bg-qualityRed"></span>
              红色
            </span>
          </label>
          <label class="quality-checkbox">
            <input type="checkbox" name="searchQuality" value="perfect" class="sr-only">
            <span
              class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-qualityPerfect/10 text-qualityPerfect border border-qualityPerfect">
              <span class="w-2 h-2 rounded-full bg-qualityPerfect"></span>
              彩色
            </span>
          </label>
        </div>
        <p class="text-xs text-gray-500 mt-1">提示：不选择时默认显示全部品质</p>
      </div>
    </div>

    <!-- 查询结果区 -->
    <div>
      <h3 class="text-lg font-medium mb-3">查询结果</h3>
      <div id="searchResult" class="max-h-[400px] overflow-y-auto scrollbar-thin">
        <div class="text-center text-gray-500 py-8">暂无词条数据，请先在录入标签添加内容</div>
      </div>
    </div>
  </div>

  <!-- 录入标签内容 -->
  <div id="entryContent" class="tab-content bg-white rounded-b-lg shadow-sm p-4 min-h-[400px]">
    <h2 class="text-xl font-semibold mb-4">词条录入</h2>

    <!-- 录入表单 -->
    <form id="entryForm" class="space-y-4 mb-6">
      <div>
        <label class="block text-sm text-gray-600 mb-1">大品类</label>
        <select id="entryCategory" class="input" required>
          <option value="">请选择大品类</option>
        </select>
      </div>

      <div>
        <label class="block text-sm text-gray-600 mb-1">小品类（可选）</label>
        <select id="entrySubCategory" class="input">
          <option value="">（可选）请选择小品类</option>
        </select>
      </div>

      <div>
        <label class="block text-sm text-gray-600 mb-1">词条名称</label>
        <div class="relative">
          <select id="entryAttribute" class="input mb-1">
            <option value="">先选品类</option>
          </select>
          <input type="text" id="entryItemName" class="input pr-8" placeholder="输入词条名称" required>
          <div id="entryItemSuggestions"
            class="absolute top-full left-0 right-0 mt-1 bg-white border rounded-md shadow-lg max-h-40 overflow-y-auto scrollbar-thin z-10 hidden">
            <!-- 录入词条建议将动态生成 -->
          </div>
        </div>
      </div>

      <div>
        <label class="block text-sm text-gray-600 mb-1">数值（支持小数）</label>
        <input type="number" step="0.01" id="entryValue" class="input" placeholder="例如：15.5" required>
      </div>

      <div>
        <label class="block text-sm text-gray-600 mb-1">品质</label>
        <select id="entryQuality" class="input" required>
        </select>
      </div>
    </form>

    <!-- 操作按钮区（新增清理按钮，添加按钮文案改为"录入"） -->
    <div class="flex flex-wrap gap-3 justify-between items-center">
      <button type="submit" form="entryForm" class="btn btn-primary">
        <i class="fa fa-plus mr-2"></i>录入
      </button>
      <div class="flex gap-3">
        <button id="exportBtn" class="btn btn-secondary">
          <i class="fa fa-copy mr-2"></i>复制全部数据
        </button>
        <button id="clearBtn" class="btn btn-danger">
          <i class="fa fa-trash mr-2"></i>清理缓存
        </button>
      </div>
    </div>

    <!-- 录入历史区 -->
    <div class="mt-6">
      <h3 class="text-lg font-medium mb-3">录入历史</h3>
      <div id="entryHistory" class="border rounded-md divide-y max-h-[200px] overflow-y-auto scrollbar-thin">
        <div class="p-4 text-gray-500 text-center">暂无录入记录</div>
      </div>
    </div>
  </div>

  <!-- 提示框 -->
  <div id="toast" class="toast bg-gray-800"></div>

  <script src="./script.js"></script>
</body>

</html>
