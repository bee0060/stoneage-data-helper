<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>石器时代辅助工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#E67E22',
                        secondary: '#3498DB',
                        neutral: '#2C3E50',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-hover {
                @apply transition-all duration-300 hover:shadow-lg hover:-translate-y-1;
            }
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- 顶部导航 -->
    <header class="bg-neutral text-white py-4 shadow-md">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-2xl md:text-3xl font-bold">
                <i class="fa fa-gamepad mr-2"></i>石器时代辅助工具集
            </h1>
            <p class="text-gray-300 mt-1">便捷查询与计算工具</p>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-grow container mx-auto px-4 py-8 md:py-16">
        <div class="max-w-md mx-auto">
            <!-- 工具卡片容器 -->
            <div class="grid gap-6">
                <!-- 金贝价值换算工具 -->
                <a href="exchange.html" class="block">
                    <div class="bg-white rounded-xl p-6 shadow card-hover border-t-4 border-primary">
                        <div class="flex items-center mb-4 jcb">
                            <div class="left flex items-center">
                                <div
                                    class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                                    <i class="fa fa-exchange text-xl"></i>
                                </div>
                                <h2 class="text-xl font-bold text-neutral ml-4">金贝价值换算</h2>
                            </div>
                            <div class="right ml-auto text-secondary">
                                <i class="fa fa-arrow-right"></i>
                            </div>
                        </div>
                        <p class="text-gray-600">
                            金贝与R价值换算工具，支持手续费计算与数量对比分析，包含风险价值评估。
                        </p>
                    </div>
                </a>

                <!-- 词条查询工具 -->
                <a href="attributes.html" class="block">
                    <div class="bg-white rounded-xl p-6 shadow card-hover border-t-4 border-secondary">
                        <div class="flex items-center mb-4 jcb">
                            <div class="left flex items-center">
                                <div
                                    class="w-12 h-12 rounded-full bg-secondary/10 flex items-center justify-center text-secondary">
                                    <i class="fa fa-search text-xl"></i>
                                </div>
                                <h2 class="text-xl font-bold text-neutral ml-4">词条查询</h2>
                            </div>
                            <div class="right ml-auto text-secondary">
                                <i class="fa fa-arrow-right"></i>
                            </div>
                        </div>
                        <p class="text-gray-600">
                            游戏内各类词条属性查询工具
                        </p>
                    </div>
                </a>

                <!-- 宠物彩线计算工具（Pet Color Line） -->
                <a href="petColorLine.html" class="block">
                    <div class="bg-white rounded-xl p-6 shadow card-hover border-t-4 border-primary">
                        <div class="flex items-center mb-4 jcb">
                            <div class="left flex items-center">
                                <div
                                    class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                                    <i class="fa fa-paw text-xl"></i>
                                </div>
                                <h2 class="text-xl font-bold text-neutral ml-4">宠物彩线计算</h2>
                            </div>
                            <div class="right ml-auto text-secondary">
                                <i class="fa fa-arrow-right"></i>
                            </div>
                        </div>
                        <p class="text-gray-600">
                            计算宠物彩线成长率，支持三级天赋技能值输入
                        </p>
                    </div>
                </a>
            </div>

            <!-- 说明信息 -->
            <div class="mt-8 bg-gray-50 rounded-lg p-4 text-center text-gray-600 text-sm">
                <p>工具仅作游戏辅助使用，数据仅供参考</p>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-neutral text-white py-4 mt-8">
        <div class="container mx-auto px-4 text-center text-sm text-gray-300">
            <p>© 2023 石器时代辅助工具集</p>
        </div>
    </footer>
</body>

</html>
