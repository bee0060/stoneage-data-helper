<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购买划算度计算</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981',
                        secondary: '#6B7280',
                        neutral: '#2C3E50',
                        warning: '#F59E0B',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .input-focus {
                @apply focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none;
            }
            .card-shadow {
                @apply shadow-md hover:shadow-lg transition-shadow;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-8 px-4">
    <div class="max-w-md mx-auto bg-white rounded-xl p-6 card-shadow relative">
        <!-- 标题栏（含水平对齐的返回按钮） -->
        <div class="flex items-center justify-center mb-8 relative">
            <a href="index.html" class="absolute left-0 text-gray-600 hover:text-neutral transition-colors">
                <i class="fa fa-arrow-left mr-1"></i> 返回
            </a>
            <h1 class="text-2xl font-bold text-neutral">
                <i class="fa fa-shopping-cart text-primary text-2xl mr-2"></i>购买划算度计算
            </h1>
        </div>

        <div class="space-y-6">
            <!-- 输入区域 -->
            <div>
                <label for="buyPrice" class="block text-sm font-medium text-gray-700 mb-1">
                    购买价格（金贝）
                </label>
                <input type="number" id="buyPrice" placeholder="例如：1000" min="1" step="1"
                       class="w-full border border-gray-300 rounded-md px-3 py-2 input-focus">
                <p class="text-xs text-gray-500 mt-1">输入你购买物品的金贝价格</p>
            </div>

            <!-- 结果区域 -->
            <div class="p-5 bg-gray-50 rounded-lg border border-gray-200">
                <h3 class="text-sm font-medium text-gray-500 mb-3">保本售价计算</h3>
                
                <div class="space-y-4">
                    <div class="flex justify-between items-center pb-2 border-b border-gray-100">
                        <span class="text-gray-600">手续费率</span>
                        <span class="font-semibold">15%</span>
                    </div>
                    
                    <div class="flex justify-between items-center pb-2 border-b border-gray-100">
                        <span class="text-gray-600">保本售价（金贝）</span>
                        <span id="breakEvenPrice" class="text-xl font-bold text-primary">0</span>
                    </div>
                    
                    <div class="bg-warning/10 p-3 rounded-md text-sm text-gray-700">
                        <p class="flex items-start">
                            <i class="fa fa-info-circle text-warning mt-0.5 mr-2"></i>
                            <span>若售价高于<span id="breakEvenText" class="font-medium">0</span>金贝，交易后将盈利；低于则亏损</span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- 计算说明 -->
            <div class="text-xs text-gray-500 bg-gray-50 p-3 rounded-md">
                <p class="font-medium mb-1">计算公式：</p>
                <p>保本售价 = 购买价格 ÷ (1 - 15%)</p>
                <p class="mt-1">（即扣除15%手续费后，仍能收回全部成本的最低售价）</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const buyPriceInput = document.getElementById('buyPrice');
            const breakEvenPrice = document.getElementById('breakEvenPrice');
            const breakEvenText = document.getElementById('breakEvenText');

            // 计算保本售价
            function calculateBreakEven() {
                const buyPrice = parseFloat(buyPriceInput.value) || 0;
                if (buyPrice <= 0) {
                    breakEvenPrice.textContent = '0';
                    breakEvenText.textContent = '0';
                    return;
                }
                
                // 手续费15%，所以需要售价 = 成本 / 0.85
                const breakEven = Math.ceil(buyPrice / 0.85);
                breakEvenPrice.textContent = breakEven;
                breakEvenText.textContent = breakEven;
            }

            // 输入变化时实时计算
            buyPriceInput.addEventListener('input', calculateBreakEven);
        });
    </script>
</body>
</html>
